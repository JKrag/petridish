[package]
name = "petri"
description = "The petridish dashboard: a ratatui TUI over ~/.petridish/projects.json."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[lib]
name = "petri"
path = "src/lib.rs"

[[bin]]
name = "petri"
path = "src/main.rs"

[dependencies]
petridish-core.workspace = true
ratatui = "0.30"
crossterm = "0.29"
chrono.workspace = true
serde.workspace = true
toml.workspace = true

# The state file is JSON — petri parses it in `run`, which the binary targets at
# runtime (not just tests), so this needs to be a runtime dependency. Spec §10
# lists `ratatui`/`crossterm`/`petridish-core`; serde_json is the JSON backend
# for `serde`, which petri-core itself depends on, but as a runtime requirement
# of *petri* we pull it in here rather than re-exporting petridish-core's
# dev-only dependency (which would otherwise be the only path for petri to call
# `serde_json::from_str` without hitting dev-dep visibility).
serde_json.workspace = true

# Column arithmetic wherever petri fits text into a width budget, plus the
# glyph-portability gate (petri/SPEC.md §4.2). Promoted from dev-only after
# review: the render paths were budgeting terminal COLUMNS but spending
# CHARACTERS, which are not the same thing the moment a project, branch or
# query contains a wide character — and `fixtures/hostile.json` carries
# a CJK name precisely because that case is meant to be handled. This is the
# same width table ratatui and crossterm use for their own cell maths, so
# using it here means petri measures text the way its renderer will.
unicode-width = "0.2"

# Unix-only: terminal job control in `exec::run_in_terminal` (Ctrl-C hand-off, #88 review
# follow-up). Already in `Cargo.lock` as a transitive dependency of crossterm/mio on every
# platform this builds for, so pulling it in directly here costs nothing extra in the
# dependency tree — it only makes an existing transitive dependency a declared one, gated
# to the one platform family (`cfg(unix)`) that has `tcsetpgrp`/process groups at all.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test-only: PTY end-to-end harness (petri/SPEC.md §8 layer 3, ADR-0003). Not in
# SPEC §10's runtime dependency list because it never ships in the binary.
# (serde_json is already a real dependency above, also usable from tests/.)
[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16.2"
