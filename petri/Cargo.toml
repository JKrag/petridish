[package]
name = "petri"
version = "0.1.0"
edition = "2024"

[lib]
name = "petri"
path = "src/lib.rs"

[[bin]]
name = "petri"
path = "src/main.rs"

[dependencies]
petridish-core = { path = "../petridish-core" }
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Test-only: PTY end-to-end harness (petri/SPEC.md §8 layer 3, ADR-0003) and
# fixture deserialization in tests/. Neither is in SPEC §10's runtime dependency
# list because neither ships in the binary.
[dev-dependencies]
portable-pty = "0.9"
serde_json = "1"
