[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petridish"
version = "0.1.0"
description = "Local monitoring daemon for macOS project activity."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Jan Krag", email = "jan.krag@eficode.com" },
]
keywords = ["macos", "launchd", "git", "claude-code", "productivity", "monitoring"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["pytest", "pyright"]

[project.urls]
Homepage = "https://github.com/JKrag/petridish"
Repository = "https://github.com/JKrag/petridish"
Issues = "https://github.com/JKrag/petridish/issues"

# `swab`/`swab-hook` were Python entry points here until the scanner was fully
# ported to Rust (`swab-rs/`, built via `cargo install --path swab-rs`) and
# the Python originals (cli.py, hook.py, and everything they depended on —
# config.py, discovery.py, git.py, events.py, scan.py, sensors/) were
# deleted. `petri` (the TUI) stays Python — it only ever read `projects.json`
# via `petridish.schema`, never wrote it, so nothing about its own code
# needed to change.
[project.scripts]
petri = "petridish.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
petridish = ["resources/*.plist"]

# Type checking is a dev-only gate — it adds no runtime dependency, so the
# stdlib-only rule for `src/petridish/` is untouched. The annotations were
# always there; this is what finally checks them.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

# pytest's fixtures (`tmp_path`, `monkeypatch`, `capsys`) are untyped at the
# call site, so strict mode reports every fixture parameter and everything
# derived from one. That was 1098 of the first run's 1417 errors and none of
# it is signal. Tests keep the substantive checks (argument/return/assignment
# types); only the "I can't infer this" family is off.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
