[workspace]
members = ["petridish-core", "petridish-cli", "swab", "petri"]
resolver = "3"

# Shared package metadata. Every member inherits from here with
# `field.workspace = true` so there is exactly one version string in the repo
# and one place to change the license/repository when they move.
#
# `version` covers all crates in lockstep. They ship as one product from one
# tag, and a user who has `swab` 1.0 and `petri` 0.9 is in a state we have no
# intention of supporting, so independent versioning would be a lie told to
# cargo.
[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
# Floor comes from `gix` and `clap` (1.85, also the edition-2024 floor); the
# widest MSRV anywhere in the resolved tree is 1.88. Verified by the MSRV job
# in CI — bump this only when that job tells you to, never speculatively.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/JKrag/petridish"
homepage = "https://github.com/JKrag/petridish"
authors = ["Jan Krag <jan.krag@eficode.com>"]
keywords = ["macos", "git", "monitoring", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]

# Dependencies shared by two or more members, pinned once. Members that need
# extra features add them locally with `features = [..]`, which unions with
# whatever is declared here.
[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` swaps serde_json's `Map` from a `BTreeMap` (alphabetical) to
# an `IndexMap` (insertion order). The installer needs it: `~/.claude/settings.json`
# is a user-owned file shared with other hook consumers, and silently
# alphabetising every key on install would be a gratuitous, alarming diff.
#
# Declared at workspace level rather than in the one crate that needs it, because
# Cargo unifies features across a build anyway — declaring it locally would mean
# `cargo test --workspace` and `cargo install -p swab` produced *different* JSON
# key ordering from the same source, which is a far worse trap than the feature
# itself. One setting, one behaviour, everywhere.
#
# Verified empirically before enabling, by diffing real output with the feature
# off and on: `projects.json` key order is unchanged (every schema type is a
# named struct, so serde uses declaration order regardless), and
# `events.ndjson` is unchanged because `swab::events::EventLine` was converted
# from a `Map` to a struct for exactly this reason.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
petridish-core = { path = "petridish-core", version = "1.0.0-beta.1" }

# Release binaries are shipped as prebuilt tarballs (Homebrew tap + shell
# installer), so build time at release is cheap and size/speed at the user's
# machine is what matters.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
