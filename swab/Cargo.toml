[package]
name = "swab"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "swab"
path = "src/main.rs"

[[bin]]
name = "swab-hook"
path = "src/bin/swab-hook.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
gix = { version = "0.86.0", features = ["status", "revision"] }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
toml = "0.8"
url = "2"
