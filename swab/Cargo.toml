[package]
name = "swab"
description = "The petridish scanner: crawls project roots, reads git state, senses agent activity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[[bin]]
name = "swab"
path = "src/main.rs"

[[bin]]
name = "swab-hook"
path = "src/bin/swab-hook.rs"

[dependencies]
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
gix = { version = "0.86.0", features = ["status", "revision"] }
petridish-core.workspace = true
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
toml.workspace = true
url = "2"
