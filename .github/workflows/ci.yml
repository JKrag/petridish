name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # The full `make check` gate. Stays macOS-only because this is the job that
    # exercises the macOS-only surface: the launchd plist, the `launchctl` argv,
    # and the xbar plugin dir. Per ARCHITECTURE.md D5 the *installer* is
    # darwin-gated while the scanner deliberately is not — which is what the
    # `rust-linux` job below now actually verifies, rather than asserting.
    # (D5 moved: it's ARCHITECTURE.md now, not DESIGN.md, which is archived.)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Pinned to the declared floor, not "latest" — two shipped bugs
          # (__replace__, url2pathname(require_scheme=)) were 3.13+/3.14-only
          # APIs that passed locally on a newer interpreter while violating
          # requires-python >=3.12. A real 3.12 job is the only complete check.
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # `swab` (and now `petridish-core`) had never been in CI before this —
      # that gap predates the Rust port and is closed here (petri/SPEC.md §8).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package + dev extras
        run: uv sync --extra dev

      # One gate, identical to what a contributor runs locally, so the two
      # cannot drift: `make check` = pytest + the Rust workspace tests
      # (petridish-core, swab) + the pyright ratchet + the post-3.12 API
      # check (scripts/check_pyver.py) — every one a prerequisite of `check`,
      # none dropped here.
      - name: make check
        run: make check

      - name: Build wheel + sdist
        run: python3 -m pip install build && python3 -m build

      # Checks that every console script pyproject DECLARES actually lands in
      # the wheel's bin/ — the names are read from pyproject rather than
      # hardcoded here, because a hardcoded list is how this step spent four
      # days red: it kept invoking `bin/swab` long after `swab` became a Rust
      # binary and left [project.scripts]. Reading the source of truth means a
      # rename (petri -> petripy, say) can't desync the two.
      - name: Verify entry points resolve from the built wheel
        run: |
          python3 -m venv /tmp/petridish-ci-install
          /tmp/petridish-ci-install/bin/pip install dist/*.whl
          python3 - <<'EOF'
          import pathlib, sys, tomllib
          scripts = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["scripts"]
          assert scripts, "pyproject declares no console scripts"
          missing = [
              name for name in scripts
              if not pathlib.Path(f"/tmp/petridish-ci-install/bin/{name}").exists()
          ]
          if missing:
              sys.exit(f"declared but absent from the wheel: {missing}")
          print(f"all {len(scripts)} declared entry points present: {sorted(scripts)}")
          EOF
          /tmp/petridish-ci-install/bin/python3 -c "from petridish.installer import render_plist; render_plist(swab_abspath='/x/swab', log_path='/x/daemon.log')"

  rust-linux:
    # ARCHITECTURE.md D5 asserts the Rust CLI is *not* macOS-bound: its sensors
    # degrade to null/empty per CLAUDE.md invariant 5, so a Linux box finding no
    # `workspaceStorage/` is that invariant working rather than a bug. That
    # claim went unverified for the repo's whole life — CI was a single
    # macos-14 job, so no line of this code had ever been executed on Linux.
    # This job is what checks it.
    #
    # Verified before landing, not aspirational: the whole workspace (461 tests,
    # 0 ignored) passes unmodified on Linux in a `rust:latest` container. No
    # production code needed changing to get here.
    #
    # Rust only, deliberately. The Python side really is macOS-only (launchd,
    # ~/Library, xbar), so widening this to `make check` would only re-run a
    # gate that cannot pass here.
    #
    # Reproducing this locally on Apple Silicon — two traps, both measured:
    #   1. Use a NATIVE linux/arm64 container, not an emulated linux/amd64 one.
    #      Under QEMU, `Command::spawn()` on a nonexistent program returns Ok
    #      instead of Err(NotFound) (the child is created, then fails to exec
    #      asynchronously — wait status 127<<8), so
    #      `spawn_detached_reports_a_missing_program_instead_of_panicking` in
    #      petri/tests/s8_exec.rs fails there. Reproduced with nine lines of
    #      plain std, no petri code involved: the emulator is the broken
    #      variable, not this workspace.
    #   2. Keep CARGO_TARGET_DIR *inside* the container. A bind-mounted target
    #      dir on Docker Desktop corrupts the build with a spurious
    #      "can't find crate for `bstr`" in gix-submodule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo` directly rather than `make rust-test`: that target prepends a
      # hardcoded ~/.rustup/toolchains/stable-aarch64-apple-darwin/bin, which is
      # both macOS- and Apple-Silicon-specific.
      #
      # `--locked` so a stale Cargo.lock fails loudly here instead of being
      # silently re-resolved — the same reasoning ARCHITECTURE.md §8.1 gives for
      # pinning it on `cargo install`.
      #
      # `--test-threads=1` matches CLAUDE.md's documented invocation.
      - run: cargo test --locked --workspace -- --test-threads=1
