name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # macOS-only by nature (launchd, ~/Library paths) — see DESIGN.md D5.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Pinned to the declared floor, not "latest" — two shipped bugs
          # (__replace__, url2pathname(require_scheme=)) were 3.13+/3.14-only
          # APIs that passed locally on a newer interpreter while violating
          # requires-python >=3.12. A real 3.12 job is the only complete check.
          python-version: "3.12"

      - name: Install package + pytest
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static post-3.12 API check
        run: python3 scripts/check_pyver.py

      - name: Run tests
        run: python3 -m pytest -q

      - name: Build wheel + sdist
        run: python3 -m pip install build && python3 -m build

      - name: Verify entry points resolve from the built wheel
        run: |
          python3 -m venv /tmp/petridish-ci-install
          /tmp/petridish-ci-install/bin/pip install dist/*.whl
          /tmp/petridish-ci-install/bin/swab --help
          /tmp/petridish-ci-install/bin/python3 -c "from petridish.installer import render_plist; render_plist(swab_abspath='/x/swab', log_path='/x/daemon.log')"
