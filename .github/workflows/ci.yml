name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints once, on the cheapest runner — they are
  # platform-independent, so running them in the OS matrix would just buy the
  # same answer twice.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    # Both platforms, deliberately. macOS is where the product runs — launchd,
    # ~/Library, the xbar plugin directory. Linux is what verifies
    # ARCHITECTURE.md D5's claim that only the *installer* is macOS-bound and
    # the scanner is not: its sensors degrade to null/empty per CLAUDE.md
    # invariant 5, so a Linux box finding no `workspaceStorage/` is that
    # invariant working rather than a bug. That claim went unverified for the
    # repo's whole life, when CI was a single macOS job.
    #
    # `petridish-cli` compiles here too, which is exactly why its
    # `check_platform` takes the OS as a parameter instead of being a
    # `#[cfg(target_os)]` gate — otherwise its tests would be unrunnable on the
    # Linux leg.
    #
    # Reproducing the Linux leg locally on Apple Silicon — two traps, both
    # measured:
    #   1. Use a NATIVE linux/arm64 container, not an emulated linux/amd64 one.
    #      Under QEMU, `Command::spawn()` on a nonexistent program returns Ok
    #      instead of Err(NotFound) (the child is created, then fails to exec
    #      asynchronously — wait status 127<<8), so
    #      `spawn_detached_reports_a_missing_program_instead_of_panicking` in
    #      petri/tests/s8_exec.rs fails there. Reproduced with nine lines of
    #      plain std, no petri code involved: the emulator is the broken
    #      variable, not this workspace.
    #   2. Keep CARGO_TARGET_DIR *inside* the container. A bind-mounted target
    #      dir on Docker Desktop corrupts the build with a spurious
    #      "can't find crate for `bstr`" in gix-submodule.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `--locked` so a stale Cargo.lock fails loudly here instead of being
      # silently re-resolved — the same reasoning ARCHITECTURE.md §8.1 gives for
      # pinning it on `cargo install`.
      #
      # `--test-threads=1` because three tests in swab/src/cli.rs mutate $HOME,
      # which is process-global. See the Makefile's `test` target.
      - run: cargo test --locked --workspace -- --test-threads=1

  # The floor declared in [workspace.package].rust-version. Without a job that
  # actually builds on it, that field is a claim rather than a guarantee.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/.*= *"//;s/".*//')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  # Licence compatibility and RUSTSEC advisories. This ships GPL-3.0-or-later
  # binaries, so a dependency arriving under an incompatible licence is a
  # release blocker, not a style note.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  # The Raycast extension has never been in any gate. It is TypeScript, has its
  # own lockfile, and reads `projects.json` through a hand-maintained mirror of
  # the schema — precisely the thing that rots silently when nothing checks it.
  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # eslint and prettier directly, not `npm run lint` (`ray lint`). That
      # wrapper calls Raycast's API to validate the `author` field in
      # package.json, which 404s for an unregistered handle and would make this
      # job permanently red for a reason that has nothing to do with the code.
      # Its genuinely useful checks are these two, and they run offline.
      - run: npx eslint .
      - run: npx prettier --check "src/**/*.{ts,tsx}" "tests/**/*.ts"
