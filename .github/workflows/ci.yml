name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # macOS-only by nature (launchd, ~/Library paths) — see DESIGN.md D5.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Pinned to the declared floor, not "latest" — two shipped bugs
          # (__replace__, url2pathname(require_scheme=)) were 3.13+/3.14-only
          # APIs that passed locally on a newer interpreter while violating
          # requires-python >=3.12. A real 3.12 job is the only complete check.
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev extras
        run: uv sync --extra dev

      # One gate, identical to what a contributor runs locally, so the two
      # cannot drift: `make check` = pytest + the pyright ratchet + the
      # post-3.12 API check (scripts/check_pyver.py, which still runs here —
      # it is a prerequisite of `check`, not a step that was dropped).
      - name: make check
        run: make check

      - name: Build wheel + sdist
        run: python3 -m pip install build && python3 -m build

      # Checks that every console script pyproject DECLARES actually lands in
      # the wheel's bin/ — the names are read from pyproject rather than
      # hardcoded here, because a hardcoded list is how this step spent four
      # days red: it kept invoking `bin/swab` long after `swab` became a Rust
      # binary and left [project.scripts]. Reading the source of truth means a
      # rename (petri -> petripy, say) can't desync the two.
      - name: Verify entry points resolve from the built wheel
        run: |
          python3 -m venv /tmp/petridish-ci-install
          /tmp/petridish-ci-install/bin/pip install dist/*.whl
          python3 - <<'EOF'
          import pathlib, sys, tomllib
          scripts = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["scripts"]
          assert scripts, "pyproject declares no console scripts"
          missing = [
              name for name in scripts
              if not pathlib.Path(f"/tmp/petridish-ci-install/bin/{name}").exists()
          ]
          if missing:
              sys.exit(f"declared but absent from the wheel: {missing}")
          print(f"all {len(scripts)} declared entry points present: {sorted(scripts)}")
          EOF
          /tmp/petridish-ci-install/bin/python3 -c "from petridish.installer import render_plist; render_plist(swab_abspath='/x/swab', log_path='/x/daemon.log')"
