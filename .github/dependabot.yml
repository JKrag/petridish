version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor bumps; majors still come individually
      # because those are the ones worth reading.
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/integrations/raycast"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
